exp_name: "mslr_ipm"
dataset: "mslr"
folds: [1,2,3,4,5]
base_config_path: "~/ope/configs/runs/{exp_name}"
base_exp_path: "~/ope/results/experiments/{exp_name}/{dataset}/fold{fold}"
base_training_path: "~/ope/results/experiments/{exp_name}/{dataset}/training"

logging_model: "2_3_worst_features"
target_model: "all_features"

subsets: ["train", "vali", "test"]

nsampled_values: [1, 5, 25]

pb_types: ["pbdcg"]
ndocs_values: [50]
logging_temps: [0.2, 0.6, 1]
target_temps: [1]

# ipm click simulation
click_model: "ipm"
ipm_alpha_bound: 1.4
ipm_alpha_seed: 42
ipm_alpha_from_model: true  # Use a separate model to determine per-position bias curve
ipm_model: "ipm_alpha_model"

bias_configs:
  - ["bias_pow0_6", 0.6, "pow"]
  - ["bias_pow1_4", 1.4, "pow"]
  - ["bias_pow1_2", 1.2, "pow"]
  - ["bias_pow0_8", 0.8, "pow"]
  - ["bias_plus0", 0.0, "plus"]
  - ["bias_minus0_1", 0.1, "minus"]
  - ["bias_zigzag0_1", 0.1, "zigzag"]

eps_multipliers:
  - ["eps_times0_25", 0.25]
  - ["eps_times0_5", 0.5]
  - ["eps_times1", 1.0]
  - ["eps_times1_5", 1.5]
  - ["eps_times2", 2.0]
  - ["eps_times3", 3.0]
  - ["eps_times0", 0.0]
  - ["eps_times0_5_to_1_5", 0.5, 1.5]
  - ["eps_times1_5_to_0_5", 1.5, 0.5]

prop_clamp_min: 0.0000001
single_repeat: false
max_outer: 1000
patience: 100
use_slope: true
use_blue: true
use_opera: true
blue_configs: {
  "BLUE": ["w0", "w9"]
} 
opera_configs: {
  "OPERA": ["w0", "w9"]
} 


n_samples: 50
n_repeats: 50
n_F_repeats: 50
chunk_size: 800000
bootstrap_chunk: 50
subsample_ratio: 0.5
bias_subsample_ratio: 0.5

training_configs:
  - ["2_3_worst_features", "{dataset}", 66.67, "worst"]
  - ["all_features", "{dataset}", 100, "worst"]
  - ["ipm_alpha_model", "{dataset}", [2, 7, 12, 17, 22, 27, 32, 37, 42, 47, 52, 57, 62, 67, 72, 77, 82, 87, 92, 97, 102, 107, 112, 117, 122]]
